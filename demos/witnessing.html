<style>
  :root{
    --bg:#0a0a0a;
    --amber:#e2a63c;
    --text:#e5e5e5;
    --dim:#6b6b6b;
    --faint:#3a3a3a;
    --border:#1c1c1c;
    --red:#c9776a;
    --teal:#6bb3c9;

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', Menlo, Consolas, monospace;
    font-size:14px;
    line-height:1.6;
  }
  .wrap{ max-width:940px; margin:0 auto; padding:56px 24px 60px; }

  .topline{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  h1{ font-size:16px; font-weight:500; color:var(--amber); margin:0; }
  .counter{ color:var(--faint); font-size:12px; }
  .chapter{ color:var(--dim); font-size:12px; margin-bottom:44px; }

  .stage{ display:flex; gap:48px; min-height:400px; }
  .narration{ flex:0 0 250px; padding-top:6px; }
  .narration p{ margin:0 0 14px; color:var(--text); }

  .panel{ flex:1; border:1px solid var(--border); padding:22px 24px; min-width:0; }
  .panel.split{ display:flex; gap:20px; border:none; padding:0; }
  .panel.split .node-card{ flex:1; border:1px solid var(--border); padding:20px 22px; }

  .node-card + .node-card{ margin-top:22px; }
  .node-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .node-id{ color:var(--dim); font-size:12px; }
  .node-type{ color:var(--amber); }
  .node-desc{ margin:4px 0 2px; }
  .node-meta{ color:var(--dim); font-size:12px; }
  .curation-tag{ color:var(--faint); font-size:11px; margin-left:10px; }
  .built-from{ color:var(--faint); font-size:11px; margin-top:6px; }
  .built-from span{ color:var(--teal); }
  .registered{ color:var(--faint); font-size:11px; margin-top:4px; }

  .log-label{ color:var(--faint); font-size:11px; margin:16px 0 4px; }
  .signal{ padding:9px 0; border-top:1px solid var(--border); border-left:2px solid transparent; padding-left:10px; margin-left:-10px; }
  .signal:first-child{ border-top:none; }
  .signal-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .signal-type{ font-size:12px; }
  .signal-type.operational{ color:var(--amber); }
  .signal-type.failure{ color:var(--red); }
  .signal-type.learning{ color:var(--teal); }
  .signal-date{ color:var(--faint); font-size:11px; }
  .signal-msg{ font-size:13px; margin-top:2px; }
  .signal-doc{ font-size:11px; color:var(--faint); margin-top:3px; }
  .signal-doc span{ color:var(--teal); }
  .signal-id{ color:var(--faint); font-size:11px; margin-top:3px; }
  .witness{ border-left-color:var(--faint); }
  .witness-tag{ color:var(--faint); font-size:11px; }
  .conflict{ border-left-color:var(--red); }
  .conflict-note{ color:var(--red); font-size:11px; margin-top:3px; }
  .hollow{ border-left-color:var(--red); opacity:0.75; }
  .hollow-note{ color:var(--red); font-size:11px; margin-top:3px; }

  .sibling-link{ flex:0 0 110px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--faint); font-size:11px; line-height:1.5; }

  .match-row{ display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-top:1px solid var(--border); }
  .match-row:first-child{ border-top:none; }
  .match-row.picked{ border-left:2px solid var(--teal); padding-left:10px; margin-left:-10px; }
  .match-pct{ color:var(--dim); font-size:12px; width:44px; flex:0 0 44px; }
  .match-row.picked .match-pct{ color:var(--teal); }
  .match-body{ flex:1; }
  .match-src{ color:var(--faint); font-size:11px; }
  .match-msg{ font-size:13px; margin-top:2px; }
  .match-tag{ color:var(--teal); font-size:11px; margin-left:8px; }

  .base-block{ margin-bottom:22px; }
  .base-name{ color:var(--amber); font-size:15px; margin-bottom:2px; }
  .base-key{ color:var(--faint); font-size:11px; margin-bottom:6px; }
  .base-meta{ color:var(--dim); font-size:12px; }
  .section-label{ color:var(--faint); font-size:11px; margin:18px 0 6px; }
  .query-label{ color:var(--dim); font-size:12px; margin-bottom:12px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip{ border:1px solid var(--border); color:var(--dim); font-size:11px; padding:3px 8px; }

  .closing p{ margin:0 0 14px; }

  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:44px; padding-top:20px; border-top:1px solid var(--border); }
  .navbtn{ background:none; border:none; cursor:pointer; color:var(--dim); font-family:inherit; font-size:13px; }
  .navbtn:hover:not(:disabled){ color:var(--amber); }
  .navbtn:disabled{ color:var(--faint); cursor:default; }
  .dots{ display:flex; gap:5px; flex-wrap:wrap; max-width:320px; }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--faint); }
  .dot.active{ background:var(--amber); }
</style>
</head>

<script>
/* ---------- entity IDs ---------- */
const ID = {
  giorgiWorkshop: 'a1c46d92',
  batteryWorkshop: 'd53f8a17',
  toolShelf: 'b7e2c941',

  candC: '9d2ef507'

/* ---------- helpers (same engine as walkthrough.html) ---------- */
function sig(type, msg, id, ts, doc, resolvedVia){
  const docHtml = doc ? `<div class="signal-doc">documentation → <span>${doc}</span></div>` : '';
  const rvHtml = resolvedVia ? `<div class="signal-doc">resolved via → <span>${resolvedVia}</span></div>` : '';
  return `<div class="signal ${type}">
    <div class="signal-top"><span class="signal-type ${type}">${type}</span><span class="signal-date">${ts}</span></div>
    <div class="signal-msg">${msg}</div>
    ${docHtml}
    ${rvHtml}
    <div class="signal-id">id: ${id}</div>
  </div>`;
}
function witnessSig(type, msg, from, ts, ref, contradicts){
  const cls = contradicts ? ' conflict' : '';
  const note = contradicts ? `<div class="conflict-note">⚠ contradicts the referenced learning signal</div>` : '';
  return `<div class="signal witness${cls}">
    <div class="signal-top"><span class="witness-tag">witness · ${from}</span><span class="signal-type ${type}">${type}</span><span class="signal-date">${ts}</span></div>
    <div class="signal-msg">${msg}</div>
    <div class="signal-id">ref: ${ref}</div>
    ${note}
  </div>`;
}
function hollowWitnessSig(type, msg, from, ts){
  return `<div class="signal witness hollow">
    <div class="signal-top"><span class="witness-tag">witness · ${from}</span><span class="signal-type ${type}">${type}</span><span class="signal-date">${ts}</span></div>
    <div class="signal-msg">${msg}</div>
    <div class="signal-id">ref: — (Referenced Signal left blank)</div>
    <div class="hollow-note">⚠ unverifiable — nothing to check this claim against</div>
  </div>`;
}
function nodeCard(id, type, desc, loc, curation, registered, builtFrom){
  const cur = curation ? `<span class="curation-tag">${curation}</span>` : '';
  const bf = builtFrom ? `<div class="built-from">built from → <span>${builtFrom}</span></div>` : '';
  const reg = registered ? `<div class="registered">registered ${registered}</div>` : '';
  return `<div class="node-card">
    <div class="node-head"><span class="node-id">${id}</span><span class="node-type">${type}</span>${cur}</div>
    <div class="node-desc">${desc}</div>
    <div class="node-meta">${loc}</div>
    ${reg}${bf}`;
}
function endCard(){ return `</div>`; }
function matchRow(pct, src, msg, picked){
  const cls = picked ? ' picked' : '';
  const tag = picked ? `<span class="match-tag">selected</span>` : '';
  return `<div class="match-row${cls}">
    <div class="match-pct">${pct}%</div>
    <div class="match-body">
      <div class="match-src">${src}${tag}</div>
      <div class="match-msg">${msg}</div>
    </div>
  </div>`;
}
function feedSplit(leftLabel, leftHtml, arrowLabel, rightLabel, rightHtml){
  return `<div class="panel split">`
    + `<div class="node-card"><div class="log-label">${leftLabel}</div>${leftHtml}</div>`
    + `<div class="sibling-link">${arrowLabel}</div>`
    + `<div class="node-card"><div class="log-label">${rightLabel}</div>${rightHtml}</div>`
    + `</div>`;
}

{
  chapter: "Part 3 — General witnessing, commons",

    + endCard()

/* ===== Part 4 — Where these signals actually live ===== */
{
  chapter: "Part 4 — Where these signals actually live",
  narration: ["Both witness signals show up attached to the nodes Giorgi visited. But they aren't stored there.",
    "Each node's feed has exactly one writer — its own keypair. Giorgi's witness signals are signed by his keypair, so they live in his own feed, not the battery workshop's or the tool shelf's."],
  panel: feedSplit(
    "battery workshop's feed — signed by its own keypair",
    sig("operational", "Cell-matching rig built. First rebuilt pack holding capacity within spec.", "e91c4a08", "2025-10-05 11:30"),
    "cited by →",

    witnessSig("operational", "Watched a full rebuild cycle. Rig sound.", ID.giorgiWorkshop, "2026-01-14 10:00", "e91c4a08")

},
{

  narration: ["A viewer looking at the battery workshop's node sees both entries together anyway — as one thread, in order.",
    "That's a client doing the work at query time: it pulls the node's own feed, finds anyone who announced a witness signal referencing it, and orders them by citation — Giorgi's entry provably came after the one it cites, because it names that entry's own ID."],
  panel: nodeCard(ID.batteryWorkshop, "energy", "Battery pack rebuilding for e-bikes, cell matching and balancing.", "Tbilisi, Georgia", "open", "2025-09-20")
    + `<div class="log-label">Steward log</div>`
    + sig("operational", "Cell-matching rig built. First rebuilt pack holding capacity within spec.", "e91c4a08", "2025-10-05 11:30")

{
  chapter: "Part 5 — A remote node, general & replication witnessing",
  narration: ["Witnessing isn't limited to what's nearby. Amara, in Nairobi, has spent eight months developing a low-cost ceramic water filter for high-sediment river water — a node curated by mathare-kitchen."],

    + `<div class="log-label">Steward log</div>`
    + sig("learning", "Composite ceramic blend confirmed. Filters high-sediment water 8hrs continuous.", "f822ccff", "2026-04-14 07:16", "hyper://a2f91c8e…/method.pdf")
    + endCard()
},
{
  chapter: "Part 5 — A remote node, general & replication witnessing",
  narration: ["David, in Kampala, finds her node through mathare-kitchen's collection. He travels to Nairobi and runs her method himself, under her supervision, for three weeks — then replicates it at home with local materials.",
    "Two different witness signals below: the first is general witnessing — he watched it work. The second is replication witnessing — he applied her method himself."],
  panel: nodeCard(ID.amaraFilter, "water", "Developing low-cost ceramic water filter for high-sediment river water.", "Nairobi, Kenya", "open", "2025-08-14")
    + `<div class="log-label">Witness log</div>`
    + witnessSig("operational", "Filter running as described. Setup replicable. Steward present throughout.", ID.davidWater, "2026-05-05 10:30", "f822ccff")
    + witnessSig("learning", "Replicated composite blend using Kampala materials. Flow rate within 5% of Nairobi result.", ID.davidWater, "2026-05-06 16:00", "f822ccff")
    + endCard()
},
{
  chapter: "Part 5 — A remote node, general & replication witnessing",
  narration: ["Then a contradiction: after 72 hours of continuous use, output drops 60% — a failure Amara's own documentation never flagged. David logs it anyway, on his own feed, citing her signal."],
  panel: nodeCard(ID.amaraFilter, "water", "Developing low-cost ceramic water filter for high-sediment river water.", "Nairobi, Kenya", "open", "2025-08-14")
    + `<div class="log-label">Witness log</div>`
    + witnessSig("operational", "Filter running as described. Setup replicable. Steward present throughout.", ID.davidWater, "2026-05-05 10:30", "f822ccff")
    + witnessSig("learning", "Replicated composite blend using Kampala materials. Flow rate within 5% of Nairobi result.", ID.davidWater, "2026-05-06 16:00", "f822ccff")
    + witnessSig("failure", "Output degrades 60% after 72hr continuous use without cleaning. Not flagged in original docs. Critical for field deployment.", ID.davidWater, "2026-05-09 12:00", "f822ccff", true)
    + endCard()
},
{
  chapter: "Part 5 — A remote node, general & replication witnessing",
  narration: ["Amara answers on her own node, with her own keypair.",
    "Original claim, independent replication, honest contradiction, steward response — four separate signatures, two separate feeds, none of it mediated by anyone in between."],
  panel: nodeCard(ID.amaraFilter, "water", "Developing low-cost ceramic water filter for high-sediment river water.", "Nairobi, Kenya", "open", "2025-08-14")
    + `<div class="log-label">Steward log</div>`
    + sig("learning", "Composite ceramic blend confirmed. Filters high-sediment water 8hrs continuous.", "f822ccff", "2026-04-14 07:16", "hyper://a2f91c8e…/method.pdf")
    + sig("learning", "Cleaning interval critical. 72hr max before significant output degradation. Updated method attached.", "9b41ee2c", "2026-05-10 09:00", "hyper://a2f91c8e…/update.pdf")
    + endCard()
},

/* ===== Part 6 — Two cores, one thread ===== */
{
  chapter: "Part 6 — Replication witnessing, two cores",

{
  chapter: "Part 6 — Replication witnessing, two cores",

    "Order between the two entries is proven by that citation, not by either device's clock."],
  panel: `<div class="closing">

  panel: nodeCard(ID.candB, "energy", "Solar charge controller design and field testing.", "Yerevan, Armenia", "open", "2025-07-11")
    + `<div class="log-label">Witness log</div>`

/* ---------- render engine ---------- */
let idx = 0;

function render(){
  const s = SLIDES[idx];
  document.getElementById('chapter').textContent = s.chapter;
  document.getElementById('counter').textContent = (idx+1) + ' / ' + SLIDES.length;
  document.getElementById('narration').innerHTML = s.narration.map(p => `<p>${p}</p>`).join('');
  document.getElementById('panelWrap').innerHTML = s.panel.trim().startsWith('<div class="panel split">')
    ? s.panel
    : `<div class="panel">${s.panel}</div>`;

  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').textContent = (idx === SLIDES.length - 1) ? 'end' : 'next →';
  document.getElementById('nextBtn').disabled = (idx === SLIDES.length - 1);

  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = SLIDES.map((_, i) => `<div class="dot${i===idx?' active':''}" onclick="jump(${i})"></div>`).join('');
}

function go(delta){
  const next = idx + delta;
  if (next < 0 || next >= SLIDES.length) return;
  idx = next;
  render();
}
function jump(i){ idx = i; render(); }

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

render();
</script>
