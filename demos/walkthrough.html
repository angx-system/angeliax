<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANGX — Walkthrough 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --amber:#e2a63c;
    --text:#e5e5e5;
    --dim:#6b6b6b;
    --faint:#3a3a3a;
    --border:#1c1c1c;
    --red:#c9776a;
    --teal:#6bb3c9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', Menlo, Consolas, monospace;
    font-size:14px;
    line-height:1.6;
  }
  .wrap{ max-width:940px; margin:0 auto; padding:56px 24px 60px; }

  .topline{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  h1{ font-size:16px; font-weight:500; color:var(--amber); margin:0; }
  .counter{ color:var(--faint); font-size:12px; }
  .chapter{ color:var(--dim); font-size:12px; margin-bottom:44px; }

  .stage{ display:flex; gap:48px; min-height:380px; }
  .narration{ flex:0 0 250px; padding-top:6px; }
  .narration p{ margin:0 0 14px; color:var(--text); }

  .panel{ flex:1; border:1px solid var(--border); padding:22px 24px; min-width:0; }
  .panel.split{ display:flex; gap:20px; border:none; padding:0; }
  .panel.split .node-card{ flex:1; border:1px solid var(--border); padding:20px 22px; }

  .node-card + .node-card{ margin-top:22px; }
  .node-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:4px; }
  .node-id{ color:var(--dim); font-size:12px; }
  .node-type{ color:var(--amber); }
  .node-desc{ margin:4px 0 2px; }
  .node-meta{ color:var(--dim); font-size:12px; }
  .curation-tag{ color:var(--faint); font-size:11px; margin-left:10px; }
  .built-from{ color:var(--faint); font-size:11px; margin-top:6px; }
  .built-from span{ color:var(--teal); }
  .registered{ color:var(--faint); font-size:11px; margin-top:4px; }

  .log-label{ color:var(--faint); font-size:11px; margin:16px 0 4px; }
  .signal{ padding:9px 0; border-top:1px solid var(--border); border-left:2px solid transparent; padding-left:10px; margin-left:-10px; }
  .signal:first-child{ border-top:none; }
  .signal-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .signal-type{ font-size:12px; }
  .signal-type.operational{ color:var(--amber); }
  .signal-type.failure{ color:var(--red); }
  .signal-type.learning{ color:var(--teal); }
  .signal-date{ color:var(--faint); font-size:11px; }
  .signal-msg{ font-size:13px; margin-top:2px; }
  .signal-doc{ font-size:11px; color:var(--faint); margin-top:3px; }
  .signal-doc span{ color:var(--teal); }
  .signal-id{ color:var(--faint); font-size:11px; margin-top:3px; }
  .witness{ border-left-color:var(--faint); }
  .witness-tag{ color:var(--faint); font-size:11px; }
  .conflict{ border-left-color:var(--red); }
  .conflict-note{ color:var(--red); font-size:11px; margin-top:3px; }

  .sibling-link{ flex:0 0 100px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--faint); font-size:11px; line-height:1.5; }

  .base-block{ margin-bottom:22px; }
  .base-name{ color:var(--amber); font-size:15px; margin-bottom:2px; }
  .base-key{ color:var(--faint); font-size:11px; margin-bottom:6px; }
  .base-meta{ color:var(--dim); font-size:12px; }
  .section-label{ color:var(--faint); font-size:11px; margin:18px 0 6px; }
  .query-label{ color:var(--dim); font-size:12px; margin-bottom:12px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip{ border:1px solid var(--border); color:var(--dim); font-size:11px; padding:3px 8px; }
  .collection-row, .partner-row{ display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--border); font-size:13px; }
  .collection-row:first-child, .partner-row:first-child{ border-top:none; }
  .collection-row .ctype{ color:var(--amber); margin-right:8px; }
  .collection-row .cid{ color:var(--dim); font-size:12px; margin-right:8px; }
  .collection-row .cdate{ color:var(--faint); font-size:11px; }
  .partner-row .pname{ color:var(--text); }
  .partner-row .pkey{ color:var(--faint); font-size:11px; margin-left:8px; }
  .verified-tag{ color:var(--teal); font-size:11px; margin-left:8px; }

  .closing p{ margin:0 0 14px; }

  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:44px; padding-top:20px; border-top:1px solid var(--border); }
  .navbtn{ background:none; border:none; cursor:pointer; color:var(--dim); font-family:inherit; font-size:13px; }
  .navbtn:hover:not(:disabled){ color:var(--amber); }
  .navbtn:disabled{ color:var(--faint); cursor:default; }
  .dots{ display:flex; gap:5px; }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--faint); }
  .dot.active{ background:var(--amber); }
</style>
</head>

/* ---------- helpers ---------- */
function sig(type, msg, id, ts, doc){
  const docHtml = doc ? `<div class="signal-doc">documentation → <span>${doc}</span></div>` : '';
  return `<div class="signal ${type}">
    <div class="signal-top"><span class="signal-type ${type}">${type}</span><span class="signal-date">${ts}</span></div>
    <div class="signal-msg">${msg}</div>
    ${docHtml}
    <div class="signal-id">id: ${id}</div>
  </div>`;
}
function witnessSig(type, msg, from, ts, ref, contradicts){
  const cls = contradicts ? ' conflict' : '';
  const note = contradicts ? `<div class="conflict-note">⚠ contradicts the referenced learning signal</div>` : '';
  return `<div class="signal witness${cls}">
    <div class="signal-top"><span class="witness-tag">witness · ${from}</span><span class="signal-type ${type}">${type}</span><span class="signal-date">${ts}</span></div>
    <div class="signal-msg">${msg}</div>
    <div class="signal-id">ref: ${ref}</div>
    ${note}
  </div>`;
}
function nodeCard(id, type, desc, loc, curation, registered, builtFrom){
  const cur = curation ? `<span class="curation-tag">${curation}</span>` : '';
  const bf = builtFrom ? `<div class="built-from">built from → <span>${builtFrom}</span></div>` : '';
  const reg = registered ? `<div class="registered">registered ${registered}</div>` : '';
  return `<div class="node-card">
    <div class="node-head"><span class="node-id">${id}</span><span class="node-type">${type}</span>${cur}</div>
    <div class="node-desc">${desc}</div>
    <div class="node-meta">${loc}</div>
    ${reg}${bf}`;
}
function endCard(){ return `</div>`; }

},

    + witnessSig("operational", "Eaten here regularly for over a year. Running exactly as described. Steward present every time.", ID.aminaClinic, "2026-03-20 09:10", "76fbe1d9")

/* ---------- render engine ---------- */
let idx = 0;

function render(){
  const s = SLIDES[idx];
  document.getElementById('chapter').textContent = s.chapter;
  document.getElementById('counter').textContent = (idx+1) + ' / ' + SLIDES.length;
  document.getElementById('narration').innerHTML = s.narration.map(p => `<p>${p}</p>`).join('');

  const panelHtml = s.panel.trim().startsWith('<div class="panel split">')
    ? s.panel
    : `<div class="panel">${s.panel}</div>`;
  document.getElementById('panelWrap').innerHTML = panelHtml;

  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').textContent = (idx === SLIDES.length - 1) ? 'end' : 'next →';
  document.getElementById('nextBtn').disabled = (idx === SLIDES.length - 1);

  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = SLIDES.map((_, i) => `<div class="dot${i===idx?' active':''}"></div>`).join('');
}

function go(delta){
  const next = idx + delta;
  if (next < 0 || next >= SLIDES.length) return;
  idx = next;
  render();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

render();
</script>
